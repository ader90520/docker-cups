<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUPS 智能云打印与扫描工作台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f6f9; color: #333; line-height: 1.5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #2c3e50; color: #fff; padding: 20px; text-align: center; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .tabs { display: flex; background: #ecf0f1; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; border: none; background: transparent; transition: all 0.2s; color: #555; }
        .tab-btn.active { background: #fff; color: #2980b9; border-bottom: 3px solid #2980b9; }
        .tab-content { display: none; padding: 25px; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .form-control:focus { border-color: #3498db; outline: none; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        .btn { display: inline-block; width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #fff; background: #3498db; border: none; border-radius: 6px; cursor: pointer; text-align: center; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #219150; }
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .status-success { background: #e8f8f5; color: #27ae60; border: 1px solid #a3e4d7; }
        .status-error { background: #fdedec; color: #e74c3c; border: 1px solid #f5b7b1; }
        .preview-box { margin-top: 20px; text-align: center; }
        .preview-box img { max-width: 100%; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .rule-card { background: #fdfefe; border: 1px solid #ebf5fb; padding: 14px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #566573; line-height: 1.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CUPS 智能云打印与扫描工作台</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('print')">📄 文件打印</button>
        <button class="tab-btn" onclick="switchTab('scan')">📷 在线扫描</button>
        <button class="tab-btn" onclick="switchTab('mail')">⚙ 云邮箱设置</button>
    </div>

    <!-- 1. 打印面板 -->
    <div id="tab-print" class="tab-content active">
        <form id="print-form">
            <div class="form-group">
                <label>选择打印机</label>
                <select id="printer-select" class="form-control" name="printer"></select>
            </div>
            <div class="form-group">
                <label>打印份数</label>
                <input type="number" name="copies" class="form-control" value="1" min="1" max="99">
            </div>
            <div class="form-group">
                <label>上传文件 (支持试卷图片自动白底加黑、PDF、文档)</label>
                <input type="file" id="print-files" name="file" class="form-control" multiple accept=".jpg,.jpeg,.png,.pdf,.bmp,.webp">
            </div>
            <button type="submit" class="btn">🚀 开始智能居中打印</button>
        </form>
        <div id="print-status" class="status-box"></div>
    </div>

    <!-- 2. 扫描面板 -->
    <div id="tab-scan" class="tab-content">
        <div class="form-group">
            <label>扫描仪硬件通道</label>
            <select id="scan-device-select" class="form-control"></select>
        </div>
        <div class="row">
            <div class="col form-group">
                <label>分辨率 (DPI)</label>
                <select id="scan-res" class="form-control">
                    <option value="150" selected>150 DPI (常规快速)</option>
                    <option value="300">300 DPI (高清文档)</option>
                </select>
            </div>
            <div class="col form-group">
                <label>扫描色彩</label>
                <select id="scan-mode" class="form-control">
                    <option value="Color" selected>彩色 (Color)</option>
                    <option value="Gray">灰度 (Gray)</option>
                </select>
            </div>
        </div>
        <button type="button" id="btn-scan" class="btn btn-success" onclick="startScan()">📷 启动硬件扫描并自动增强</button>
        <div id="scan-status" class="status-box"></div>
        <div id="scan-preview" class="preview-box" style="display:none;">
            <p style="margin-bottom: 10px; font-weight:600;">扫描结果预览：</p>
            <img id="scan-img" src="" alt="扫描结果">
            <div style="margin-top: 10px;">
                <a id="scan-download" href="#" class="btn" style="width: auto; padding: 8px 20px; text-decoration: none;">💾 下载扫描原件</a>
            </div>
        </div>
    </div>

    <!-- 3. 云邮箱与推送设置面板 -->
    <div id="tab-mail" class="tab-content">
        <form id="mail-form">
            <div class="form-group">
                <label>云邮件自动打印服务</label>
                <select id="mail_enable" class="form-control" name="enable">
                    <option value="true">开启 (后台每5秒轮询检测)</option>
                    <option value="false">关闭</option>
                </select>
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>IMAP 服务器</label>
                    <input type="text" id="mail_server" class="form-control" name="server" value="imap.qq.com">
                </div>
                <div class="col form-group" style="flex: 0 0 100px;">
                    <label>端口</label>
                    <input type="number" id="mail_port" class="form-control" name="port" value="993">
                </div>
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>邮箱账号</label>
                    <input type="email" id="mail_user" class="form-control" name="user" placeholder="例如: 137062870@qq.com">
                </div>
                <div class="col form-group">
                    <label>授权码 / 专用密码</label>
                    <input type="password" id="mail_password" class="form-control" name="password" placeholder="留空或保留默认表示不修改">
                </div>
            </div>

            <!-- 将 PushPlus Token 移动至账号与授权码下方 -->
            <div class="form-group" style="background: #fdfefe; border: 1px dashed #3498db; padding: 12px; border-radius: 6px;">
                <label style="color: #2980b9;">💬 PushPlus 微信通知 Token (出纸成功 / 缺纸卡纸推送)</label>
                <input type="text" id="mail_pushplus_token" class="form-control" name="pushplus_token" placeholder="填写 PushPlus 发送的 Token 即可接收微信出纸状态">
                <small style="color: #e67e22; display: block; margin-top: 4px;">💡 打印机真正出纸完成后向微信推送“出纸成功”；缺纸或卡纸时即刻告警！</small>
            </div>

            <div class="form-group">
                <label>🔑 打印暗号 (邮件标题或正文中包含即可打印)</label>
                <input type="text" id="mail_keyword" class="form-control" name="keyword" placeholder="例如: 888 或 打印 (留空则不校验暗号)">
            </div>
            <div class="form-group">
                <label>📧 指定发送人邮箱 (留空 = 允许所有人凭暗号打印)</label>
                <input type="text" id="mail_whitelist" class="form-control" name="whitelist" placeholder="留空允许任意邮箱；填了则仅限指定邮箱 (多邮箱用逗号隔开)">
            </div>

            <div class="rule-card">
                <strong>📌 当前策略运行规则：</strong><br>
                1. 不填发件邮箱 + 填了暗号：任何邮箱发来邮件，只要标题或正文中带此暗号，直接自动打印。<br>
                2. 填了发件邮箱：只有白名单中的邮箱发来才打印，陌生人发来一律不打印。<br>
                3. 原图打印技巧：标题或正文若包含“原图”，自动跳过漂白算法，原样输出彩照。
            </div>

            <button type="submit" class="btn">💾 保存云邮件策略并立即生效</button>
        </form>
        <div id="mail-status" class="status-box"></div>
    </div>
</div>

<script>
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'scan') loadScanDevices();
    if (name === 'mail') loadMailConfig();
}

function showStatus(elemId, success, msg) {
    const box = document.getElementById(elemId);
    box.style.display = 'block';
    box.className = 'status-box ' + (success ? 'status-success' : 'status-error');
    box.innerText = msg;
}

// 加载打印设备
function loadPrinters() {
    fetch('/api/devices')
        .then(r => r.json())
        .then(d => {
            if (d.success && d.data && d.data.printers) {
                const sel = document.getElementById('printer-select');
                sel.innerHTML = '';
                d.data.printers.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.innerText = p.name + (p.is_default ? ' (默认)' : '');
                    if (p.is_default) opt.selected = true;
                    sel.appendChild(opt);
                });
            }
        });
}

// 打印提交
document.getElementById('print-form').onsubmit = function(e) {
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.disabled = true;
    btn.innerText = '正在上传处理并下发打印...';
    const fd = new FormData(this);
    fetch('/api/print', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(res => {
            btn.disabled = false;
            btn.innerText = '🚀 开始智能居中打印';
            showStatus('print-status', res.success, res.message || (res.success ? '任务已派发' : '打印失败'));
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = '🚀 开始智能居中打印';
            showStatus('print-status', false, '网络或服务异常: ' + err);
        });
};

// 加载扫描仪列表
function loadScanDevices() {
    fetch('/api/scan/devices')
        .then(r => r.json())
        .then(d => {
            const sel = document.getElementById('scan-device-select');
            sel.innerHTML = '';
            if (d.success && d.data && d.data.devices && d.data.devices.length > 0) {
                d.data.devices.forEach(dev => {
                    const opt = document.createElement('option');
                    opt.value = dev.id;
                    opt.innerText = dev.name;
                    sel.appendChild(opt);
                });
            } else {
                const opt = document.createElement('option');
                opt.value = '';
                opt.innerText = '未检测到可用扫描仪 (请检查通电与USB)';
                sel.appendChild(opt);
            }
        });
}

// 发起扫描
function startScan() {
    const btn = document.getElementById('btn-scan');
    const dev = document.getElementById('scan-device-select').value;
    const res = document.getElementById('scan-res').value;
    const mode = document.getElementById('scan-mode').value;

    btn.disabled = true;
    btn.innerText = '正在驱动硬件扫描并拉平增强，请稍候...';
    document.getElementById('scan-preview').style.display = 'none';

    const fd = new FormData();
    fd.append('device', dev);
    fd.append('resolution', res);
    fd.append('mode', mode);

    fetch('/api/scan', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
            btn.disabled = false;
            btn.innerText = '📷 启动硬件扫描并自动增强';
            if (d.success) {
                showStatus('scan-status', true, '扫描成功！已完成黑边切除与加黑');
                const img = document.getElementById('scan-img');
                img.src = d.data.url + '?t=' + new Date().getTime();
                document.getElementById('scan-download').href = '/api/scan/download?file=' + d.data.filename;
                document.getElementById('scan-preview').style.display = 'block';
            } else {
                showStatus('scan-status', false, '扫描失败: ' + d.message);
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = '📷 启动硬件扫描并自动增强';
            showStatus('scan-status', false, '请求中断: ' + err);
        });
}

// 加载邮箱配置
function loadMailConfig() {
    fetch('/api/mail_config')
        .then(r => r.json())
        .then(d => {
            if (d.success && d.data) {
                const cfg = d.data;
                document.getElementById('mail_enable').value = cfg.enable ? 'true' : 'false';
                document.getElementById('mail_server').value = cfg.server || 'imap.qq.com';
                document.getElementById('mail_port').value = cfg.port || 993;
                document.getElementById('mail_user').value = cfg.user || '';
                document.getElementById('mail_password').value = cfg.password || '';
                document.getElementById('mail_pushplus_token').value = cfg.pushplus_token || '';
                document.getElementById('mail_keyword').value = cfg.keyword || '';
                document.getElementById('mail_whitelist').value = cfg.whitelist || '';
            }
        });
}

// 保存邮箱配置
document.getElementById('mail-form').onsubmit = function(e) {
    e.preventDefault();
    const payload = {
        enable: document.getElementById('mail_enable').value === 'true',
        server: document.getElementById('mail_server').value,
        port: parseInt(document.getElementById('mail_port').value),
        user: document.getElementById('mail_user').value,
        password: document.getElementById('mail_password').value,
        pushplus_token: document.getElementById('mail_pushplus_token').value,
        keyword: document.getElementById('mail_keyword').value,
        whitelist: document.getElementById('mail_whitelist').value
    };

    fetch('/api/mail_config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => {
        showStatus('mail-status', d.success, d.message || (d.success ? '设置已更新生效' : '保存失败'));
    })
    .catch(err => {
        showStatus('mail-status', false, '保存错误: ' + err);
    });
};

loadPrinters();
</script>

</body>
</html>
