<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>在线打印 - CUPS 智能工作台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
    <script src="/static/js/client_ai.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>

<div class="wrapper">
    <!-- 顶部主导航 -->
    <div class="top-navbar">
        <div class="nav-brand">🖨️ 在线打印 - CUPS 智能工作台</div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchNavTab('print')">智能打印</button>
            <button class="nav-btn" onclick="switchNavTab('scan')">在线扫描</button>
            <button class="nav-btn" onclick="switchNavTab('devices')">设备管理</button>
            <button class="nav-btn" onclick="switchNavTab('mail')">云邮箱设置</button>
        </div>
    </div>

    <!-- 智能打印面板 -->
    <div id="panel-print" class="tab-panel-container" style="display:block;">
        <!-- 打印机选择栏与 AI 状态指示 -->
        <div class="printer-bar-card">
            <div class="printer-bar-left">
                <span style="font-weight:700; font-size:13px; color:#1e293b;">🖨️ 打印机</span>
                <select id="printer-select" class="printer-select-ctrl" onchange="DashboardService.onPrinterChange()"></select>
                <button type="button" class="btn-icon-refresh" onclick="DashboardService.loadPrinters(false)" title="刷新状态">🔄</button>
            </div>
            <span id="ai-engine-pill" class="ai-engine-tag">⚡ 端侧 AI 就绪 (WASM 兼容模式)</span>
        </div>

        <!-- 模式子导航 -->
        <div class="sub-nav-tabs">
            <div class="sub-nav-item active" id="tab-sub-normal" onclick="PrintManager.switchSubTab('normal')">📄 标准文档/试卷</div>
            <div class="sub-nav-item" id="tab-sub-idcard" onclick="PrintManager.switchSubTab('idcard')">🪪 身份证专属打印</div>
        </div>

        <!-- 响应式主布局网格 -->
        <div class="pc-double-layout">
            <!-- 左列：文件输入与参数配置 -->
            <div class="col-left">
                <!-- 1. 标准文档上传卡片 -->
                <div class="card-box" id="sec-upload-normal">
                    <div class="card-title">
                        <span>📁 上传文档/试卷</span>
                        <button type="button" class="btn-text-danger" onclick="PrintManager.clearFiles('normal')">清空列表</button>
                    </div>
                    <div class="upload-drag-area" id="drag-drop-zone-normal">
                        <div class="upload-drag-icon">📂</div>
                        <div class="upload-drag-text"><b>点击选取</b> 或 直接将文档/图片拖拽至此处</div>
                        <input type="file" id="file-input-normal" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.bmp" style="display:none;" onchange="PrintManager.onFilesSelected(this.files)">
                    </div>
                    <div id="file-list-normal" style="margin-top:8px; display:none; flex-direction:column; gap:4px;"></div>
                    <div style="margin-top:10px; background:#f8fafc; padding:8px 10px; border-radius:6px; border:1px solid #e2e8f0;">
                        <label style="font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;">
                            <input type="checkbox" id="chk-normal-merge" onchange="PrintManager.onMergeChange()" style="width:15px; height:15px; cursor:pointer;">
                            <span>📑 多张图片合并在单张 A4 纸上输出 (网格拼版)</span>
                        </label>
                    </div>
                </div>

                <!-- 2. 身份证专属上传卡片 -->
                <div class="card-box" id="sec-upload-idcard" style="display:none;">
                    <div class="card-title">
                        <span>🪪 上传身份证照片 (支持 1~3 人合并打在单张 A4)</span>
                        <div style="display:flex; gap:6px;">
                            <button type="button" class="nav-btn" style="padding:2px 8px; font-size:11px;" onclick="IdCardManager.addPerson()">➕ 增加一人</button>
                            <button type="button" class="btn-text-danger" onclick="IdCardManager.clearAll()">清空照片</button>
                        </div>
                    </div>
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px; margin-bottom:8px;">
                        <div style="font-size:12px; font-weight:700; color:#334155; margin-bottom:8px;">第 1 人身份证信息</div>
                        <div class="idcard-ratio-grid">
                            <div class="idcard-ratio-box" id="idcard-slot-front-0">
                                <div class="idcard-ratio-placeholder" id="placeholder-front-0">
                                    <div class="icon">👤</div>
                                    <div class="title">正面 (人像面)</div>
                                    <div class="sub">点击或拖拽上传正面</div>
                                </div>
                                <img id="preview-front-0" class="idcard-ratio-img" style="display:none;" alt="正面">
                                <input type="file" id="file-idcard-front-0" accept="image/*" style="display:none;" onchange="IdCardManager.onSideUploaded(0, 'front', this.files)">
                            </div>
                            <div class="idcard-ratio-box" id="idcard-slot-back-0">
                                <div class="idcard-ratio-placeholder" id="placeholder-back-0">
                                    <div class="icon">🇨🇳</div>
                                    <div class="title">反面 (国徽面)</div>
                                    <div class="sub">点击或拖拽上传反面</div>
                                </div>
                                <img id="preview-back-0" class="idcard-ratio-img" style="display:none;" alt="反面">
                                <input type="file" id="file-idcard-back-0" accept="image/*" style="display:none;" onchange="IdCardManager.onSideUploaded(0, 'back', this.files)">
                            </div>
                        </div>
                    </div>
                    <div id="idcard-person-container"></div>
                </div>

                <!-- 3. 打印参数面板 -->
                <div class="card-box">
                    <div class="card-title">⚙️ 打印参数</div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:8px;">
                        <div>
                            <label style="font-size:11px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">颜色模式</label>
                            <div class="flat-radio-group">
                                <button type="button" class="flat-radio-btn active" id="btn-color-mono" onclick="PrintManager.setColorMode('monochrome')">⚫ 黑白</button>
                                <button type="button" class="flat-radio-btn" id="btn-color-rgb" onclick="PrintManager.setColorMode('color')">🎨 彩色</button>
                            </div>
                        </div>
                        <div>
                            <label style="font-size:11px; font-weight:600; color:var(--text-sub); display:block; margin-bottom:4px;">打印方向</label>
                            <div class="flat-radio-group">
                                <button type="button" class="flat-radio-btn active" id="btn-orient-port" onclick="PrintManager.setOrientation('portrait')">▯ 纵向</button>
                                <button type="button" class="flat-radio-btn" id="btn-orient-land" onclick="PrintManager.setOrientation('landscape')">▭ 横向</button>
                            </div>
                        </div>
                    </div>

                    <div class="param-grid">
                        <div class="form-item">
                            <label>双面打印</label>
                            <select id="p-duplex" class="form-ctrl">
                                <option value="none" selected>单面打印</option>
                                <option value="long">双面长边翻转 (书籍)</option>
                                <option value="short">双面短边翻转 (日历)</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label>份数</label>
                            <input type="number" id="p-copies" class="form-ctrl" value="1" min="1" max="99">
                        </div>
                        <div class="form-item">
                            <label>纸张大小</label>
                            <select id="p-media" class="form-ctrl" onchange="PrintManager.onPaperSizeChange()">
                                <option value="A4" selected>A4 (210×297mm)</option>
                                <option value="A5">A5 (148×210mm)</option>
                                <option value="B5">B5 (176×250mm)</option>
                            </select>
                        </div>
                        <div class="form-item">
                            <label>去黑底增强 (全能王模式)</label>
                            <select id="p-enhance" class="form-ctrl" onchange="PrintManager.onEnhanceChange()">
                                <option value="true" selected>开启 (视窗实时白底)</option>
                                <option value="false">关闭 (原图直打)</option>
                            </select>
                        </div>
                        <div class="form-item" style="grid-column: span 2;">
                            <label>页面范围 (如: 1-5 8，留空打全部)</label>
                            <input type="text" id="p-page-ranges" class="form-ctrl" placeholder="留空 = 全部">
                        </div>
                    </div>

                    <button type="button" class="btn-submit-green" id="btn-submit" onclick="PrintManager.submitJob()">🖨️ 提交打印</button>
                    <div id="print-alert" style="margin-top:6px; font-size:11px;"></div>
                </div>
            </div>

            <!-- 右列：实时 A4 画幅预览视窗与状态栏 -->
            <div class="col-right">
                <div class="preview-container">
                    <div class="preview-toolbar">
                        <span style="font-size:13px; font-weight:700;">👁️ 实时预览</span>
                        <div style="display:flex; align-items:center; gap:4px;">
                            <span id="preview-lock-badge" class="preview-lock-badge unlocked" onclick="EnhanceEngine.toggleLock()" title="点击切换锁定/缩放手势">
                                🔒 <span id="lock-text">点击激活操作</span>
                            </span>
                            <button type="button" class="nav-btn" style="border:1px solid #cbd5e1; padding:2px 6px;" onclick="EnhanceEngine.changePage(-1)">‹</button>
                            <span id="page-counter-lbl" style="font-size:12px; font-weight:600; color:#475569; min-width:35px; text-align:center;">0 / 0</span>
                            <button type="button" class="nav-btn" style="border:1px solid #cbd5e1; padding:2px 6px;" onclick="EnhanceEngine.changePage(1)">›</button>
                            <button type="button" class="nav-btn" style="border:1px solid #cbd5e1; padding:2px 6px;" onclick="EnhanceEngine.adjustZoom(-0.25)">🔍 -</button>
                            <button type="button" class="nav-btn" style="border:1px solid #cbd5e1; padding:2px 6px;" onclick="EnhanceEngine.resetZoom()">1:1 复位</button>
                            <button type="button" class="nav-btn" style="border:1px solid #cbd5e1; padding:2px 6px;" onclick="EnhanceEngine.adjustZoom(0.25)">🔍 +</button>
                        </div>
                    </div>

                    <div class="viewport-wrapper" id="viewport-box" onclick="EnhanceEngine.onViewportClick()">
                        <div class="sheet-a4-viewport" id="a4-viewport">
                            <div style="font-size:12px; color:#94a3b8; text-align:center;" id="viewport-empty-tip">上传文件后实时呈现效果</div>
                            <canvas id="canvas-preview"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 打印机实时工作状态指标 -->
                <div class="printer-status-bar">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>📈 打印机状态:</span>
                        <b id="dash-status-pill" style="color:#10b981;">空闲</b>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>队列任务数:</span>
                        <b id="dash-queue-count" style="color:#0f172a;">0</b>
                        <button type="button" class="btn-icon-refresh" onclick="DashboardService.loadPrinters(true)">🔄</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 其余运维面板维持完整路由支撑 -->
    <div id="panel-scan" class="tab-panel-container" style="display:none;"></div>
    <div id="panel-devices" class="tab-panel-container" style="display:none;"></div>
    <div id="panel-mail" class="tab-panel-container" style="display:none;"></div>
</div>

</body>
</html>
