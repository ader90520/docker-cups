name: Build and Commit Minimal OpenCV for ARM32

on:
  workflow_dispatch: # 在 GitHub Actions 页面点击一键触发

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予自动向仓库提交代码的权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARMv7 Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Compile Minimal OpenCV inside Debian ARM32 Container
        run: |
          mkdir -p modules
          docker run --rm --platform linux/arm/v7 -v $(pwd)/modules:/dist debian:bookworm-slim bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            
            # 1. 补全 Python 编译所需的全部底层头文件和 pybind11
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake git python3-dev python3-numpy \
              python3-setuptools pybind11-dev ca-certificates \
              libjpeg-dev libpng-dev

            # 2. 浅克隆 OpenCV 4.8.0 源码
            git clone --depth 1 --branch 4.8.0 https://github.com/opencv/opencv.git /tmp/opencv
            cd /tmp/opencv
            mkdir build && cd build

            # 3. 极限精简编译：开启 core, imgproc 和 dnn，彻底关闭所有 GUI 与多媒体
            cmake -D CMAKE_BUILD_TYPE=Release \
                  -D CMAKE_INSTALL_PREFIX=/usr/local \
                  -D BUILD_SHARED_LIBS=OFF \
                  -D BUILD_opencv_python3=ON \
                  -D PYTHON3_EXECUTABLE=/usr/bin/python3 \
                  -D BUILD_TESTS=OFF \
                  -D BUILD_PERF_TESTS=OFF \
                  -D BUILD_EXAMPLES=OFF \
                  -D BUILD_DOCS=OFF \
                  -D WITH_1394=OFF \
                  -D WITH_CUDA=OFF \
                  -D WITH_CUFFT=OFF \
                  -D WITH_FFMPEG=OFF \
                  -D WITH_GSTREAMER=OFF \
                  -D WITH_GTK=OFF \
                  -D WITH_OPENEXR=OFF \
                  -D WITH_TIFF=OFF \
                  -D WITH_V4L=OFF \
                  -D WITH_WEBP=OFF \
                  -D WITH_IPP=OFF \
                  -D WITH_ITT=OFF \
                  -D WITH_LAPACK=OFF \
                  -D WITH_EIGEN=OFF \
                  -D BUILD_opencv_apps=OFF \
                  -D BUILD_opencv_dnn=ON \
                  -D BUILD_PROTOBUF=ON \
                  -D BUILD_opencv_video=OFF \
                  -D BUILD_opencv_videoio=OFF \
                  -D BUILD_opencv_calib3d=OFF \
                  -D BUILD_opencv_features2d=OFF \
                  -D BUILD_opencv_flann=OFF \
                  -D BUILD_opencv_highgui=OFF \
                  -D BUILD_opencv_ml=OFF \
                  -D BUILD_opencv_objdetect=OFF \
                  -D BUILD_opencv_photo=OFF \
                  -D BUILD_opencv_stitching=OFF \
                  -D BUILD_opencv_gapi=OFF \
                  ..

            # 4. 关键修复：降低并发数至 2，防止 QEMU 模拟器打满内存导致编译器崩溃
            make -j2

            # 5. 查找生成的动态库 (全局搜索，防止 CMake 存放路径变动)
            echo ">>> 正在查找生成的 cv2.so 文件..."
            SO_PATH=$(find . -name "cv2*.so" | head -n 1)
            
            if [ -z "$SO_PATH" ]; then
              echo "❌ 致命错误: 未能找到生成的 cv2.so！Python 模块可能被跳过了。"
              exit 1
            fi
            
            echo "✔ 成功找到动态库: $SO_PATH"
            cp "$SO_PATH" /dist/cv2.so
            strip --strip-unneeded /dist/cv2.so
          '

      - name: Commit and Push cv2.so directly to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/cv2.so
          git commit -m "Auto-build: fix & update minimal ARM32 cv2.so (with DNN) to modules" || echo "No changes to commit"
          git push
