name: Auto Fetch AI Model

on:
  workflow_dispatch:

jobs:
  download-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install huggingface_hub requests

      - name: Smart Fetch ONNX Model
        run: |
          mkdir -p webapp/models
          python -c "
          import os, shutil
          from huggingface_hub import hf_hub_download, list_repo_files

          repo_id = 'DocsaidLab/DocAligner'
          try:
              print(f'>>> 正在连接 HuggingFace 检索 {repo_id} ...')
              files = list_repo_files(repo_id)
              
              # 优先寻找轻量级的 lcnet 模型
              onnx_files = [f for f in files if f.endswith('.onnx') and 'lcnet' in f.lower()]
              if not onnx_files:
                  onnx_files = [f for f in files if f.endswith('.onnx')]
              
              if onnx_files:
                  target_file = onnx_files[0]
                  print(f'✔ 找到模型: {target_file}，正在启动专用线路下载...')
                  
                  # 自动处理 LFS 和重定向下载
                  path = hf_hub_download(repo_id=repo_id, filename=target_file)
                  shutil.copy(path, 'webapp/models/doc_corner.onnx')
                  
                  print('✔ 模型下载并提取成功！')
                  exit(0)
              else:
                  print('❌ 仓库中未找到 .onnx 文件。')
          except Exception as e:
              print(f'❌ 获取失败，可能仓库已被设为私有或网络阻断: {e}')
          
          exit(1)
          "
          
      - name: Commit and Push to Repository
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-fetch: add doc_corner.onnx AI model via HF Hub" || echo "No changes to commit"
          git push
