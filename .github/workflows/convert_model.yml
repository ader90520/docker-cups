name: Convert Model to Optimized ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - 'weights/**'

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装 unrar 解压工具
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar

      - name: 解压 RAR 分卷并建立模型路径映射
        run: |
          mkdir -p weights/image_trimming_enhancement
          TARGET_FILE="weights/image_trimming_enhancement/model_mbv3_iou_mix_2C049.pth"

          echo "[*] 正在解压 weights/ 目录下的 RAR 分卷..."
          # 解压 part1.rar 会自动联合解压 part2
          unrar x -o+ weights/model_mbv3_iou_mix_2C049.part1.rar weights/

          # 寻找解压出的完整 .pth 文件并对齐硬编码路径
          EXTRACTED_PTH=$(find weights -maxdepth 2 -name "*.pth" | head -n 1)
          if [ -z "$EXTRACTED_PTH" ]; then
            echo "[-] 解压失败，未找到 .pth 权重文件！"
            ls -lR weights/
            exit 1
          fi

          echo "[+] 成功提取权重: $EXTRACTED_PTH"
          cp "$EXTRACTED_PTH" "$TARGET_FILE"
          ls -lh "$TARGET_FILE"

      - name: 克隆算法源码以获取网络定义
        run: |
          git clone --depth=1 https://github.com/jiangnanboy/Doc-Image-Tool.git /tmp/Doc-Image-Tool

      - name: 安装模型转换与 INT8 量化依赖
        run: |
          pip install torch torchvision onnx onnxruntime onnxslim opencv-python-headless

      - name: 导出为 ONNX 并进行轻量化剪枝与 INT8 量化
        run: |
          python - << 'EOF'
          import os
          import sys
          import torch
          import onnx
          import onnxslim
          from onnxruntime.quantization import quantize_dynamic, QuantType

          # 1. 注入 Doc-Image-Tool 路径并载入模型定义
          sys.path.append("/tmp/Doc-Image-Tool")
          import function_method.DocTrimmingEnhancement as doc_trim

          model = doc_trim.doc_trimming_enhancement_model
          model.eval()

          # 2. 导出基础 FP32 ONNX
          dummy_input = torch.randn(1, 3, 256, 256, dtype=torch.float32)
          raw_onnx = "raw_model.onnx"
          torch.onnx.export(
              model,
              dummy_input,
              raw_onnx,
              input_names=["input"],
              output_names=["output"],
              opset_version=13,
              do_constant_folding=True
          )
          print(f"[+] 原始 ONNX 导出成功: {os.path.getsize(raw_onnx)/1024/1024:.2f} MB")

          # 3. 算子精简与无用节点剪枝 (onnxslim)
          slim_onnx = "slim_model.onnx"
          onnxslim.slim(raw_onnx, slim_onnx)
          print(f"[+] 剪枝优化完成: {os.path.getsize(slim_onnx)/1024/1024:.2f} MB")

          # 4. INT8 动态量化 (体积缩减至 6MB 左右，适配 N1 2GB 内存)
          os.makedirs("models", exist_ok=True)
          final_onnx = "models/doc_corner.onnx"
          quantize_dynamic(
              model_input=slim_onnx,
              model_output=final_onnx,
              weight_type=QuantType.QUInt8
          )
          final_size = os.path.getsize(final_onnx) / 1024 / 1024
          print(f"[+] 最终适配 N1 的量化模型生成成功: {final_onnx} (体积: {final_size:.2f} MB)")
          EOF

      - name: 将转换好的轻量模型提交回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add models/doc_corner.onnx
          git commit -m "chore: extract rar and quantize doc_corner.onnx via Actions" || exit 0
          git push
