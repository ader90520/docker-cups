name: Convert Model to Optimized ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - 'weights/**'

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 合并分卷权重文件
        run: |
          mkdir -p weights
          if ls weights/model.zip.* 1> /dev/null 2>&1; then
            echo "[*] 检测到分卷文件，正在合并..."
            cat weights/model.zip.* > weights/model_mbv3_iou_mix_2C049.pth
            echo "[+] 分卷合并成功！文件大小:"
            ls -lh weights/model_mbv3_iou_mix_2C049.pth
          fi

      - name: 克隆算法源码以获取网络定义
        run: |
          git clone --depth=1 https://github.com/jiangnanboy/Doc-Image-Tool.git /tmp/Doc-Image-Tool

      - name: 安装模型转换与 INT8 量化依赖
        run: |
          pip install torch torchvision onnx onnxruntime onnxslim opencv-python-headless

      - name: 导出为 ONNX 并进行轻量化剪枝与 INT8 量化
        run: |
          python - << 'EOF'
          import os
          import sys
          import torch
          import onnx
          import onnxslim
          from onnxruntime.quantization import quantize_dynamic, QuantType

          # 1. 注入 Doc-Image-Tool 算法模块路径
          sys.path.append("/tmp/Doc-Image-Tool")
          
          # 动态匹配模块定义
          try:
              import function_method.DocTrimmingEnhancement as doc_trim
          except Exception:
              from function_method import DocTrimmingEnhancement as doc_trim

          weight_path = "weights/model_mbv3_iou_mix_2C049.pth"
          if not os.path.exists(weight_path):
              raise FileNotFoundError(f"未找到权重文件: {weight_path}")

          print(f"[*] 正在载入模型权重: {weight_path}")
          checkpoint = torch.load(weight_path, map_location="cpu")

          # 智能定位模型对象或类
          model = None
          if isinstance(checkpoint, torch.nn.Module):
              model = checkpoint
          else:
              # 遍历模块寻找模型类（通常继承自 torch.nn.Module）
              for attr_name in dir(doc_trim):
                  attr = getattr(doc_trim, attr_name)
                  if isinstance(attr, type) and issubclass(attr, torch.nn.Module) and attr != torch.nn.Module:
                      try:
                          inst = attr()
                          inst.load_state_dict(checkpoint)
                          model = inst
                          print(f"[+] 匹配到模型类: {attr_name}")
                          break
                      except Exception:
                          continue

          if model is None:
              # 降级尝试全局 Net / Model
              try:
                  from function_method.DocTrimmingEnhancement.models import Net
                  model = Net()
                  model.load_state_dict(checkpoint)
              except Exception:
                  model = checkpoint

          model.eval()

          # 2. 导出基础 FP32 ONNX
          dummy_input = torch.randn(1, 3, 256, 256, dtype=torch.float32)
          raw_onnx = "raw_model.onnx"
          torch.onnx.export(
              model,
              dummy_input,
              raw_onnx,
              input_names=["input"],
              output_names=["output"],
              opset_version=13,
              do_constant_folding=True
          )
          print(f"[+] 原始 ONNX 导出成功: {os.path.getsize(raw_onnx)/1024/1024:.2f} MB")

          # 3. 算子精简与无用节点剪枝 (onnxslim)
          slim_onnx = "slim_model.onnx"
          onnxslim.slim(raw_onnx, slim_onnx)
          print(f"[+] 剪枝优化完成: {os.path.getsize(slim_onnx)/1024/1024:.2f} MB")

          # 4. INT8 动态量化 (体积缩减至 6MB 左右，适配 N1 2GB 内存)
          os.makedirs("models", exist_ok=True)
          final_onnx = "models/doc_corner.onnx"
          quantize_dynamic(
              model_input=slim_onnx,
              model_output=final_onnx,
              weight_type=QuantType.QUInt8
          )
          final_size = os.path.getsize(final_onnx) / 1024 / 1024
          print(f"[+] 最终适配 N1 的量化模型生成成功: {final_onnx} (体积: {final_size:.2f} MB)")
          EOF

      - name: 将转换好的轻量模型提交回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add models/doc_corner.onnx
          git commit -m "chore: compile and quantize doc_corner.onnx via GitHub Actions" || exit 0
          git push
