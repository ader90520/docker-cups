name: Export DocAligner Lightweight ONNX

on:
  workflow_dispatch:

jobs:
  export-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装基础依赖
        run: |
          pip install --upgrade pip
          pip install torch onnx onnxruntime docsaidkit albumentations

      - name: 克隆 DocAligner 源码并导出 ONNX
        run: |
          # 1. 克隆官方源码并以开发模式安装
          git clone --depth 1 https://github.com/DocsaidLab/DocAligner.git /tmp/DocAligner
          cd /tmp/DocAligner
          pip install -e .

          # 2. 调用官方接口加载 LCNet 权重并导出为静态 256x256 ONNX
          python -c "
          import os, torch, onnx
          from docaligner import DocAligner

          print('>>> 正在拉取 LCNet100 权重并构建网络...')
          model_name = 'lcnet100_h_e_bifpn_256'
          aligner = DocAligner(model_name=model_name)
          model = aligner.model
          model.eval()

          dummy_input = torch.randn(1, 3, 256, 256)
          out_dir = '$GITHUB_WORKSPACE/webapp/models'
          os.makedirs(out_dir, exist_ok=True)
          out_path = os.path.join(out_dir, 'doc_corner.onnx')

          print(f'>>> 导出静态 ONNX 到: {out_path} ...')
          torch.onnx.export(
              model,
              dummy_input,
              out_path,
              export_params=True,
              opset_version=12,
              do_constant_folding=True,
              input_names=['input'],
              output_names=['output']
          )

          size_mb = os.path.getsize(out_path) / (1024 * 1024)
          print(f'✔ 导出完成！文件体积: {size_mb:.2f} MB')
          "

      - name: 归档生成可下载文件 (页面直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: doc_corner_onnx
          path: webapp/models/doc_corner.onnx

      - name: 自动提交模型到代码仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-build: successfully exported doc_corner.onnx (DocAligner LCNet100)" || echo "Nothing to commit"
          git push
