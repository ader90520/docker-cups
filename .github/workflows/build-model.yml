name: Export DocCornerNet ONNX

on:
  workflow_dispatch:

jobs:
  export-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装模型转换依赖
        run: |
          pip install --upgrade pip
          pip install tensorflow keras tf2onnx onnx

      - name: 克隆开源仓库并执行原生 ONNX 导出
        run: |
          mkdir -p webapp/models
          TARGET_FILE="$GITHUB_WORKSPACE/webapp/models/doc_corner.onnx"

          echo ">>> 正在克隆 DocCornerNet-CoordClass 开源项目..."
          git clone --depth 1 https://github.com/mapo80/DocCornerNet-CoordClass.git /tmp/model_source
          cd /tmp/model_source

          echo ">>> 检查作者自带 checkpoint 目录..."
          ls -R checkpoints || true

          echo ">>> 执行原生 export_onnx.py 编译转换..."
          python export_onnx.py \
            --checkpoint checkpoints/mobilenetv2_256_best \
            --output /tmp/doc_corner.onnx \
            --opset 12 || python export_onnx.py --output /tmp/doc_corner.onnx || true

          if [ -f /tmp/doc_corner.onnx ]; then
            cp /tmp/doc_corner.onnx "$TARGET_FILE"
            echo "✔ 成功生成 doc_corner.onnx"
          else
            echo "查找生成的其他 onnx 文件..."
            find /tmp/model_source -name "*.onnx" -exec cp {} "$TARGET_FILE" \;
          fi

          if [ -f "$TARGET_FILE" ]; then
            ls -lh "$TARGET_FILE"
          else
            echo "⚠ 未能生成 ONNX 模型，前端将自动保持使用 OpenCV 极速几何拉平通道"
          fi

      - name: 归档生成可下载文件 (Artifact)
        if: hashFiles('webapp/models/doc_corner.onnx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: doc_corner_onnx
          path: webapp/models/doc_corner.onnx

      - name: 自动提交模型到代码仓库
        if: hashFiles('webapp/models/doc_corner.onnx') != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-build: successfully exported doc_corner.onnx via DocCornerNet" || echo "Nothing to commit"
          git push
