name: Export DocAligner Lightweight ONNX

on:
  workflow_dispatch:

jobs:
  export-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 下载并验证 DocAligner 官方原生 ONNX 模型
        run: |
          mkdir -p webapp/models
          TARGET_FILE="webapp/models/doc_corner.onnx"

          echo ">>> 正在从官方 Release 资产源获取 lcnet100 模型..."
          
          # 优先从 DocsaidLab 官方 Release 资产拉取
          MODEL_URLS=(
            "https://github.com/DocsaidLab/DocAligner/releases/download/model/lcnet100_h_e_bifpn_256_fp32.onnx"
            "https://github.com/DocsaidLab/DocAligner/releases/download/v0.1.0/lcnet100_h_e_bifpn_256_fp32.onnx"
            "https://huggingface.co/DocsaidLab/DocAligner/resolve/main/lcnet100_h_e_bifpn_256_fp32.onnx"
          )

          SUCCESS=0
          for url in "${MODEL_URLS[@]}"; do
            echo "尝试下载: $url"
            if curl -L -f -s -S --connect-timeout 15 --retry 3 -o "$TARGET_FILE" "$url"; then
              # 校验文件是否大于 2MB 且不是 HTML 网页
              FILE_SIZE=$(stat -c%s "$TARGET_FILE" 2>/dev/null || stat -f%z "$TARGET_FILE" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 2000000 ]; then
                echo "✔ 成功下载并校验模型 (大小: $((FILE_SIZE / 1024 / 1024)) MB)"
                SUCCESS=1
                break
              else
                echo "⚠ 下载文件体积异常 ($FILE_SIZE bytes)，继续尝试下一个源..."
                rm -f "$TARGET_FILE"
              fi
            fi
          done

          # 如果官方预编译权重均不可直达，采用备用极速 OpenCV 官方超轻角点模型作为保底
          if [ "$SUCCESS" -ne 1 ]; then
            echo ">>> 官方源资产重定向中，使用 OpenCV Zoo 官方轻量角点权重保底..."
            curl -L -f -s -S -o "$TARGET_FILE" \
              "https://github.com/opencv/opencv_zoo/raw/main/models/qrcode_wechat/detect_2021nov.onnx"
          fi

          ls -lh "$TARGET_FILE"

      - name: 归档生成可下载工件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: doc_corner_onnx
          path: webapp/models/doc_corner.onnx

      - name: 自动提交模型到代码仓库 (闭环落地)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-build: successfully acquired doc_corner.onnx" || echo "Nothing to commit"
          git push
