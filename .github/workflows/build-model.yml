name: Export DocAligner Lightweight ONNX

on:
  workflow_dispatch:

jobs:
  export-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install --upgrade pip
          pip install docaligner onnx onnxruntime torch

      - name: 编译导出标准轻量 doc_corner.onnx
        run: |
          python -c "
          import os, torch, onnx
          from docaligner import DocAligner

          print('>>> [1/3] 正在加载 DocAligner LCNet100 超轻骨干权重...')
          aligner = DocAligner(model_name='lcnet100_h_e_bifpn_256')
          model = aligner.model
          model.eval()

          # 构造标准的 256x256 静态输入尺寸 (无动态算子开销，完美适配移动端 Safari/WASM)
          dummy_input = torch.randn(1, 3, 256, 256)
          output_dir = 'webapp/models'
          os.makedirs(output_dir, exist_ok=True)
          output_path = os.path.join(output_dir, 'doc_corner.onnx')

          print('>>> [2/3] 正在导出为纯净 ONNX (Opset 12)...')
          torch.onnx.export(
              model,
              dummy_input,
              output_path,
              export_params=True,
              opset_version=12,
              do_constant_folding=True,
              input_names=['input'],
              output_names=['output']
          )

          size_mb = os.path.getsize(output_path) / (1024 * 1024)
          print(f'✔ [3/3] 编译成功！文件已生成至: {output_path} (体积: {size_mb:.2f} MB)')
          "

      - name: 归档生成可下载文件 (页面直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: doc_corner_onnx
          path: webapp/models/doc_corner.onnx

      - name: 自动提交模型到代码仓库 (实现无需手动上传的闭环)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-build: successfully exported doc_corner.onnx (DocAligner LCNet100)" || echo "Nothing to commit"
          git push
