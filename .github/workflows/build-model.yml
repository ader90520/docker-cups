name: Export DocCornerNet ONNX

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install tensorflow keras tf2onnx onnx

      - name: Clone & Run Native Exporter
        run: |
          git clone https://github.com/mapo80/DocCornerNet-CoordClass.git /tmp/model_source
          cd /tmp/model_source

          # 使用作者原生 export_onnx.py 并传齐必选参数
          python export_onnx.py \
            --checkpoint checkpoints/mobilenetv2_256_best \
            --output /tmp/doc_corner.onnx \
            --opset 13

          # 校验生成结果
          if [ ! -f /tmp/doc_corner.onnx ]; then
            echo "作者 export_onnx 未直接在 /tmp 生成，查找工作区内所有的 onnx 文件..."
            find . -name "*.onnx" -exec cp {} /tmp/doc_corner.onnx \;
          fi

          ls -lh /tmp/doc_corner.onnx

          mkdir -p $GITHUB_WORKSPACE/webapp/models/
          cp /tmp/doc_corner.onnx $GITHUB_WORKSPACE/webapp/models/doc_corner.onnx

      - name: Commit Model to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/models/doc_corner.onnx
          git commit -m "Auto-build: successfully exported doc_corner.onnx" || echo "Nothing to commit"
          git push
