name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台仿真 (支持 32位 armv7 与 64位 arm64)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 登录 GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 关键步骤 1：构建 Slim 版（必须包含 linux/arm/v7 供给海纳思使用）
      - name: 构建并推送 Slim 精简版 (海纳思 32位 专属)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: |
            ader90520/cups:slim
            ghcr.io/${{ github.repository_owner }}/cups:slim

      # 关键步骤 2：构建 Latest 标准版（主要供 N1 及其他 64 位机器）
      - name: 构建并推送 Latest 完整版 (N1 64位 专属)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ader90520/cups:latest
            ghcr.io/${{ github.repository_owner }}/cups:latest
