name: Build and Publish Multi-Arch Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Full 版：主攻 x86 与 64位 ARM (N1, 树莓派4/5, 主流海纳思)
          - variant: full
            dockerfile: ./Dockerfile
            platforms: linux/amd64,linux/arm64
            tags: |
              ader90520/cups:2.4.2
              ader90520/cups:full
              ader90520/cups:latest
          # 2. Slim 版：额外兼容 32位 arm/v7 (玩客云, 全志H3, 1+4海纳思)
          - variant: slim
            dockerfile: ./Dockerfile.slim
            platforms: linux/amd64,linux/arm64,linux/arm/v7
            tags: |
              ader90520/cups:slim
              ader90520/cups:latest-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 针对构建平台启用 QEMU 模拟器
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 初始化 Buildx 多架构构建引擎
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ader90520
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 矩阵并行构建，并启用 GitHub GHA 缓存极速复用
      - name: Build and Push Docker Image (${{ matrix.variant }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ matrix.tags }}
          # 核心优化：开启 Actions 原生缓存，二次构建时间缩短 70% 以上
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
