name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台仿真 (支持 32位 armv7 与 64位 arm64)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 关键点：自动兼容你之前设置的各种 Docker Hub 密码变量名
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'ader90520' }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      # 同时登录 GitHub Packages (免密，内置 token)
      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. 专门为海纳思机顶盒构建 32 位 ARMv7 架构的 Slim 版
      - name: 构建并推送 Slim 版 (海纳思 32位 armv7)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: |
            ader90520/cups:slim
            ghcr.io/${{ github.repository_owner }}/cups:slim

      # 2. 专门为斐讯 N1 构建 64 位 ARM64 架构的 Latest 版
      - name: 构建并推送 Latest 完整版 (N1 64位 arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ader90520/cups:latest
            ghcr.io/${{ github.repository_owner }}/cups:latest
