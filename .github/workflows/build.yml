name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台仿真
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 转换仓库所有者为纯小写
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'ader90520' }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Slim 版构建（开启 GitHub Actions Cache 缓存，第二次构建快 5 倍）
      - name: 构建并推送 Slim 版
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.slim
          # 核心性能平衡：arm64 (斐讯N1) 与 amd64 (x86) 速度极快，arm/v7 经缓存后提速
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=cups-slim
          cache-to: type=gha,mode=max,scope=cups-slim
          tags: |
            ader90520/cups:slim
            ghcr.io/${{ steps.prep.outputs.owner }}/cups:slim

      # 2. Latest 版构建（只编译主流 64 位 arm64 与 amd64，省去 armv7 冗长仿真）
      - name: 构建并推送 Latest 完整版
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=cups-latest
          cache-to: type=gha,mode=max,scope=cups-latest
          tags: |
            ader90520/cups:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/cups:latest
