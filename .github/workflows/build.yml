name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台仿真 (支持 armv7/arm64/amd64)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 规范化镜像拥有者名称为纯小写，防止 ghcr.io 拒绝大写
      - name: 转换仓库所有者为纯小写
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'ader90520' }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Slim 精简版 (支持海纳思 armv7、斐讯 N1 arm64、x86 主机 amd64)
      - name: 构建并推送 Slim 版 (全平台轻量)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ader90520/cups:slim
            ghcr.io/${{ steps.prep.outputs.owner }}/cups:slim

      # 2. Latest 完整版 (带全量开源驱动 printer-driver-all，支持 arm64 与 x86 amd64)
      - name: 构建并推送 Latest 完整驱动版
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ader90520/cups:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/cups:latest
